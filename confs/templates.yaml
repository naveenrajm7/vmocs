base-ubuntu:
  image: /tmp/ubuntu-24.04.qcow2
  machine-type: q35
  disk-model: virtio
  disk-cache: unsafe
  mount-points:
    workspace:
      path: /home/user
      type: virtio-fs
  ssh-user: ubuntu
  ssh-timeout: 180

# Deny guest-initiated access to the host and outside networks.  The vmocs
# loopback-only SSH forward remains available for session management.
secure-agent:
  inherits: base-ubuntu
  description: Isolated agent VM with QEMU user-network egress disabled
  network:
    restrict: true
    ipv6: false

test-extra-disk:
  inherits: base-ubuntu
  extra-disks:
    - file: /tmp/extra-disk-test.qcow2
      device: nvme
      cache: none

saved-ubuntu:
  inherits: base-ubuntu
  image: /tmp/ubuntu-saved.qcow2

base-ubuntu-uefi:
  inherits: base-ubuntu
  firmware: /usr/share/OVMF/OVMF_CODE_4M.fd
  firmware-vars-template: /usr/share/OVMF/OVMF_VARS_4M.fd

# Fast-boot template: run 'vmocs snapshot create base-ubuntu /tmp/ubuntu-snap'
# then uncomment snapshot: below to enable ~3-5s restore instead of full boot.
snap-ubuntu:
  inherits: base-ubuntu
  snapshot: /tmp/ubuntu-snap

# Vagrant boot mode: image must have a 'vagrant' user with the Vagrant insecure
# public key pre-installed.  No cloud-init support required — works for Windows,
# BSD, or any custom appliance built to the Vagrant convention.
windows-vm:
  image: /tmp/win11.qcow2
  boot-mode: vagrant
  ssh-user: vagrant
  ssh-timeout: 300
  machine-type: q35
  disk-model: virtio

windows-packer:
  description: Windows 11 AMD driver build — UEFI + Secure Boot + Hyper-V + TPM 2.0 (GPU passthrough excluded)
  image: /var/lib/vmocs/images/base-win11-driver.qcow2
  machine-type: pc-q35-8.2
  disk-model: virtio-scsi
  disk-cache: writeback
  boot-mode: vagrant
  ssh-user: vagrant
  ssh-timeout: 600
  firmware: /usr/share/OVMF/OVMF_CODE_4M.ms.fd
  firmware-vars-template: /usr/share/OVMF/OVMF_VARS_4M.ms.fd
  display: vnc
  vnc-port: 5910
  clock-offset: localtime
  hyperv: true
  smm: true
  tpm: true
  insert-key: false
  ssh-key: /home/user/.ssh/id_ed25519
  pci-root-port: true
  network:
    hostfwd:
      - tcp:127.0.0.1:3389-:3389
      - tcp:127.0.0.1:5985-:5985
  mount-points:
    workspace:
      path: /home/user
      type: virtio-fs
  custom-args:
    - -no-shutdown
    - -device
    - qemu-xhci,id=usb
    - -device
    - usb-tablet,bus=usb.0
    - -smbios
    - type=0,vendor="American Megatrends Inc.",version="5.12",date="04/01/2024"
    - -smbios
    - type=1,manufacturer="Dell Inc.",product="PowerEdge R750",version="1.0",serial="DL1234XTX"
    - -smbios
    - type=2,manufacturer="Dell Inc.",product="PowerEdge R750"

windows-packer-v2:
  description: Windows 11 AMD driver build v2 — VirtIO-FS + WinFsp + RDP + SSH (builds4)
  inherits: windows-packer
  image: /var/lib/vmocs/images/win11-vmocs.qcow2
  insert-key: false
  ssh-key: /opt/vmocs/lib/vmocs/keys/vagrant_insecure_key
  vnc-port: 5912
  mount-points:
    home:
      path: /home/user
      type: virtio-fs

debian-vagrant:
  image: /var/lib/vmocs/images/debian-vagrant.qcow2
  boot-mode: vagrant
  ssh-user: vagrant
  ssh-timeout: 120
  machine-type: q35
  disk-model: virtio

debian-vagrant-uefi:
  inherits: debian-vagrant
  firmware: /usr/share/OVMF/OVMF_CODE_4M.fd
  firmware-vars-template: /usr/share/OVMF/OVMF_VARS_4M.fd
