qemu-bin: /usr/bin/qemu-system-x86_64
runtime-dir: /tmp/vmocs
templates: /etc/vmocs/templates.yaml

gpu-devices: []

network:
  mode: user  # SLIRP; QEMU 10.1+ also supports mode: passt when installed
  ssh-port-range: [60222, 60322]

# Host processes started and owned for the lifetime of a VM. Templates select
# features; operators control executable and profile paths here.
sidecars:
  startup-timeout: 60
  stop-timeout: 10
  swtpm:
    binary: /usr/bin/swtpm
  virtiofsd:
    binary: /usr/libexec/virtiofsd
  rocjitsu:
    binary: /opt/rocjitsu/bin/rocjitsu
    profiles:
      mi455x: /opt/rocjitsu/share/rocjitsu/configs/gfx1250_mi455x.json
  rocm-ernic:
    binary: /opt/rocm-ernic/bin/rocm-ernic
