# vmocs SPANK plugin — drop this file in /etc/slurm/plugstack.conf.d/
#
# Optional arguments:
#   vmocs_path=/usr/local   — prefix containing bin/vmocs (default: use PATH)
#   vmocs_conf=PATH         — path to vmocs.yaml
#
# On clusters where vmocs is installed to /usr/local/bin, the default PATH
# is sufficient and vmocs_path can be omitted.

optional spank_vmocs.so vmocs_conf=/etc/vmocs/vmocs.yaml
