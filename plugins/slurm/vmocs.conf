# vmocs SPANK plugin — drop this file in /etc/slurm/plugstack.conf.d/
#
# Optional arguments:
#   vmocs_path=/usr/local   — prefix containing bin/vmocs (default: use PATH)
#   vmocs_conf=/etc/vmocs/vmocs.yaml — config passed to every vmocs command
#
# Example with explicit path:
#   optional spank_vmocs.so vmocs_path=/trinity/local vmocs_conf=/etc/vmocs/vmocs.yaml

optional spank_vmocs.so
