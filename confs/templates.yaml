base-ubuntu:
  image: /tmp/ubuntu-24.04.qcow2
  machine-type: q35
  disk-model: virtio
  disk-cache: unsafe
  mount-points: {}
  ssh-user: ubuntu
  ssh-timeout: 180

saved-ubuntu:
  inherits: base-ubuntu
  image: /tmp/ubuntu-saved.qcow2

# Fast-boot template: run 'vmocs snapshot create base-ubuntu /tmp/ubuntu-snap'
# then uncomment snapshot: below to enable ~3-5s restore instead of full boot.
snap-ubuntu:
  inherits: base-ubuntu
  snapshot: /tmp/ubuntu-snap
