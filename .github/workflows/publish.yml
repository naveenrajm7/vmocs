name: Publish GitHub Release Assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  python-package:
    name: Python wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        run: python3 development/check_release.py --tag '${{ github.event.release.tag_name }}'

      - name: Build and check Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  slurm-debian-package:
    name: Slurm plugin Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian and Slurm build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper fakeroot libslurm-dev lintian

      - name: Validate release version
        run: python3 development/check_release.py --tag '${{ github.event.release.tag_name }}'

      - name: Build, lint, and label the Debian package
        run: |
          make -C plugins/slurm deb
          lintian plugins/vmocs-slurm-plugin_*_amd64.deb

          VMOCS_VERSION=$(python3 development/check_release.py)
          SLURM_VERSION=$(dpkg-query -W -f='${Version}' libslurm-dev)
          SLURM_SERIES=$(printf '%s\n' "$SLURM_VERSION" | sed -E 's/^[0-9]+://; s/^([0-9]+\.[0-9]+).*/\1/')
          . /etc/os-release
          ARCH=$(dpkg --print-architecture)
          PACKAGE=$(find plugins -maxdepth 1 -name "vmocs-slurm-plugin_${VMOCS_VERSION}_${ARCH}.deb" -print -quit)
          test -n "$PACKAGE"

          mkdir -p release
          ASSET="release/vmocs-slurm-plugin_${VMOCS_VERSION}_slurm-${SLURM_SERIES}_${ID}-${VERSION_ID}_${ARCH}.deb"
          cp "$PACKAGE" "$ASSET"
          dpkg-deb --info "$ASSET"
          dpkg-deb --contents "$ASSET" | grep -q 'slurm/spank_vmocs.so'

      - uses: actions/upload-artifact@v4
        with:
          name: release-slurm-debian
          path: release/*.deb
          if-no-files-found: error

  slurm-rpm-package:
    name: Slurm plugin RPM package
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM and Slurm build tools
        run: dnf install -y gcc make python3 rpm-build slurm-devel

      - name: Validate release version
        run: python3 development/check_release.py --tag '${{ github.event.release.tag_name }}'

      - name: Build and inspect the RPM package
        run: |
          make -C plugins/slurm rpm
          mkdir -p release
          find plugins/slurm/rpm/RPMS -type f -name '*.rpm' -exec cp '{}' release/ \;
          test "$(find release -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          rpm -K release/*.rpm
          rpm -qpl release/*.rpm | grep -q 'slurm/spank_vmocs.so'

      - uses: actions/upload-artifact@v4
        with:
          name: release-slurm-rpm
          path: release/*.rpm
          if-no-files-found: error

  publish:
    name: Attach all packages to the GitHub release
    needs: [python-package, slurm-debian-package, slurm-rpm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate and checksum release assets
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          cd release-assets
          sha256sum ./*.whl ./*.tar.gz ./*.deb ./*.rpm > SHA256SUMS

      - name: Upload every asset together
        run: gh release upload '${{ github.event.release.tag_name }}' release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
